<style>
:root{--ink:#19354e;--orange:#ff853d;--paper:#fffefa;--sky:#a7ecff;--shadow:rgba(40,89,118,.18)}*{box-sizing:border-box}html{font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,-apple-system,"Segoe UI",sans-serif;background:#dff8fb}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 15% 8%,#fff3bd 0 7%,transparent 30%),linear-gradient(145deg,#b8f3ff,#e6faff 65%,#f5ffe9);touch-action:pan-y;overscroll-behavior-y:contain}button{font:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer}button:focus-visible{outline:4px solid #1a76e1;outline-offset:3px}.wrap{max-width:570px;margin:auto;padding:12px 13px max(20px,env(safe-area-inset-bottom))}.head{display:flex;align-items:center;justify-content:space-between;gap:7px;margin:2px 2px 8px}.logo{font-weight:1000;font-size:clamp(25px,6vw,33px);letter-spacing:-1.3px;line-height:1}.logo .hot{color:#ed582d}.sub{font-size:12px;letter-spacing:.8px;color:#52839b;font-weight:900;margin-top:5px;text-transform:uppercase}.sound{width:48px;height:48px;display:grid;place-items:center;background:#fff;border:3px solid #d4edf0;border-radius:16px;font-size:23px;box-shadow:0 4px 0 #bedce3}.top-progress{display:flex;gap:7px;align-items:center;justify-content:center;margin:8px 0 12px}.progress-dot{padding:0;height:14px;min-width:0;flex:1;max-width:52px;border-radius:30px;background:#d2e3ec;border:2px solid #b3d3e3}.progress-dot.active{background:#fbbb42;border-color:#fa9e20;transform:scaleY(1.18)}.progress-dot.done{background:#69d9ac;border-color:#36bf8b}.progress-dot.replayable{cursor:pointer}.progress-dot:disabled{cursor:default}.progress-dot.replayable:hover{filter:brightness(1.08)}.choice-head{font-size:13px;font-weight:900;letter-spacing:.4px;margin:0 4px 7px;display:flex;justify-content:space-between}.car-choices{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin-bottom:10px}.car-choice{border:3px solid #dbe8ee;background:#fff;border-radius:15px;min-height:62px;padding:4px 1px 3px;box-shadow:0 4px 0 #c8d8e2;position:relative;transition:transform .1s}.car-choice svg{display:block;width:100%;max-width:76px;height:38px;margin:auto}.car-choice.selected{border-color:#ff9c3b;background:#fff4d5;box-shadow:0 4px 0 #e6a63c;transform:translateY(-2px)}.car-choice.selected:after{content:'✓';position:absolute;right:3px;top:-6px;border-radius:50%;background:#ff9c3b;color:white;font-size:12px;width:20px;height:20px;display:grid;place-items:center;font-weight:900}.board-shell{background:#fff;border:5px solid #fff;border-radius:25px;overflow:hidden;box-shadow:0 7px 0 #b1d8e2,0 10px 23px var(--shadow);position:relative}.stage{display:block;width:100%;height:auto;aspect-ratio:420/405;touch-action:manipulation}.board-note{position:absolute;top:12px;left:50%;transform:translateX(-50%);white-space:nowrap;max-width:95%;overflow:hidden;text-overflow:ellipsis;color:#356077;border-radius:30px;background:rgba(255,255,255,.91);box-shadow:0 3px 0 #d8edf0;padding:8px 13px;font-size:clamp(12px,3vw,14px);font-weight:950;text-align:center;pointer-events:none}.piece-area{margin-top:13px}.instruction{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:15px;font-weight:950;margin:0 5px 9px}.tip{font-size:11px;letter-spacing:.1px;font-weight:750;color:#68849b;text-align:right}.pieces{display:flex;justify-content:center;gap:7px;min-height:100px}.piece{position:relative;flex:1 1 0;max-width:118px;min-width:0;border:3px solid #ffc58f;background:linear-gradient(180deg,#fffef8,#ffefd8);border-radius:17px;min-height:99px;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 5px 0 #eda765;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;transition:transform .12s,background .12s}.piece:active{transform:translateY(3px);box-shadow:0 2px 0 #eda765}.piece svg{height:49px;width:95%;pointer-events:none}.piece .pname{font-size:clamp(11px,2.9vw,13px);font-weight:950;color:#ae571f;line-height:1.1;text-align:center;pointer-events:none}.pieces .empty-tray{align-self:center;color:#7c9bab;text-align:center;font-weight:800;font-size:14px}.actions{display:grid;grid-template-columns:1fr 2.1fr;gap:10px;margin-top:15px}.btn{border:0;border-radius:19px;min-height:69px;font-size:clamp(17px,4.8vw,23px);font-weight:1000;display:flex;align-items:center;justify-content:center;gap:10px;letter-spacing:-.5px}.btn-reset{background:#fff;color:#37698b;border:3px solid #d6e6ed;box-shadow:0 6px 0 #c3d9e3}.btn-go{color:#fff;background:linear-gradient(180deg,#ffb54d,#f37636);border:3px solid #f09a3b;box-shadow:0 6px 0 #d45525;text-shadow:0 2px 0 #d86b2e}.btn-go:active,.btn-reset:active{transform:translateY(3px);box-shadow:0 3px 0 #c7a17e}.btn-go:disabled{opacity:.6}.btn-icon{font-size:30px}.assistance{display:flex;align-items:center;justify-content:space-between;margin:13px 5px 0}.hint-btn{color:#44647d;background:#fff;border:2px solid #d5eaf0;border-radius:14px;padding:9px 14px;font-size:15px;font-weight:900;box-shadow:0 3px 0 #b4d9dd}.hint-btn:active{transform:translateY(2px)}#levelCount{font-size:11px;color:#5d93a4;font-weight:950;letter-spacing:1px}.footer{margin:17px auto 2px;text-align:center;font-size:11px;font-weight:800;color:#84a5af}.toast{min-height:22px;font-size:14px;font-weight:950;text-align:center;margin:11px 0 0;color:#298277}.big-overlay{position:absolute;inset:0;background:rgba(23,67,92,.20);display:flex;align-items:center;justify-content:center;z-index:5;padding:24px;animation:fadeIn .2s ease}.overlay-inner{border:6px solid #fff;background:linear-gradient(150deg,#fffbdc,#fff0b2);border-radius:28px;padding:25px 20px 23px;width:min(360px,95%);text-align:center;box-shadow:0 12px 0 #dcaf69,0 18px 30px #4e7b8b52}.overlay-emoji{font-size:57px;line-height:1.1;animation:pop .6s ease infinite alternate}.overlay-inner h2{font-size:clamp(24px,6vw,35px);line-height:1.05;margin:10px 0 7px;letter-spacing:-1px}.overlay-inner p{font-weight:850;color:#697b7b;font-size:16px;margin:0 0 15px}.overlay-inner button{background:#fa8838;color:#fff;border:0;border-bottom:6px solid #cd6526;border-radius:17px;font-size:21px;font-weight:950;width:100%;padding:14px 12px}.overlay-inner .replay{background:#4db6c4;border-bottom-color:#318390;margin-top:9px;font-size:15px}.cloud{animation:cloudFloat 7s ease-in-out infinite alternate}.cloud2{animation-delay:-3.1s}.dinomouth{transform-box:fill-box;transform-origin:9% 90%;animation:mouth 2.3s ease-in-out infinite alternate}.fire{transform-box:fill-box;transform-origin:50% 100%;animation:fire 1.1s ease-in-out infinite alternate}.dragonwing{transform-box:fill-box;transform-origin:bottom center;animation:flap 1.4s ease-in-out infinite alternate}.flower{animation:flowerBob 2s ease-in-out infinite alternate}.slot-dash{animation:dash 14s linear infinite}.gap-highlight{animation:blink 1s ease-in-out infinite alternate}.gorillaarm{transform-box:fill-box;transform-origin:center top;animation:flap 1.4s ease-in-out infinite alternate}.trunk{animation:trunk 1.8s ease-in-out infinite alternate}.tentacles{transform-box:fill-box;transform-origin:center top;animation:flap 1.6s ease-in-out infinite alternate}.splash{animation:fire .8s ease-in-out infinite alternate}@keyframes trunk{to{transform:translateY(4px) rotate(-4deg)}}.wheel{transform-box:fill-box;transform-origin:center}.racing .wheel{animation:wheelspin .15s linear infinite}.confetti{position:absolute;z-index:7;pointer-events:none;top:-25px;width:11px;height:16px;border-radius:3px;animation:fall 1.9s linear forwards}.drag-ghost{position:fixed;z-index:99;pointer-events:none;border:3px solid #ffb668;border-radius:17px;display:grid;place-items:center;width:100px;height:76px;background:#fff6dd;box-shadow:0 8px 20px #2b445f4a;transform:translate(-50%,-50%) scale(1.1);font-size:38px}#carMoving{pointer-events:none}#stageSlots [data-slot-index]{cursor:pointer}@keyframes cloudFloat{to{transform:translateX(14px)}}@keyframes mouth{0%,30%{transform:rotate(-2deg)}70%,100%{transform:rotate(14deg)}}@keyframes fire{to{transform:scale(.8,1.3) rotate(9deg);opacity:.5}}@keyframes flap{to{transform:rotate(-13deg)}}@keyframes flowerBob{to{transform:rotate(5deg)}}@keyframes dash{to{stroke-dashoffset:-320}}@keyframes blink{to{opacity:.3}}@keyframes wheelspin{to{transform:rotate(180deg)}}@keyframes fall{to{top:110%;transform:translateX(34px) rotate(670deg);opacity:.8}}@keyframes pop{to{transform:scale(1.14) rotate(3deg)}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@media(max-width:375px){.wrap{padding:8px 8px max(16px,env(safe-area-inset-bottom))}.piece{min-height:86px}.pieces{min-height:89px}.piece svg{height:41px}.btn{min-height:60px}.head{margin-bottom:4px}.car-choice{min-height:54px}.car-choice svg{height:31px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}}

.progress-dot{height:29px;min-height:29px;font-size:13px;font-weight:1000;color:#647f8b;display:grid;place-items:center}.progress-dot.active{color:#88510e}.progress-dot.done{color:#1e7358}.dino-chomp .dinomouth{animation:mouth .16s ease-in-out infinite alternate!important}.dragon-flare .fire{animation:fire .15s ease-in-out infinite alternate!important}.board-shell.hazard-bump{animation:boardWiggle .35s ease-in-out 1}@keyframes boardWiggle{0%,100%{transform:translateX(0)}30%{transform:translateX(-3px)}70%{transform:translateX(3px)}}.reaction-text{font-family:system-ui,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:2px}.hint-btn:focus-visible,.progress-dot:focus-visible{outline:4px solid #2775c9;outline-offset:3px}

<body>
<div class="wrap">
 <header class="head"><div><div class="logo">🚗 Pistas do <span class="hot">Bê!</span></div><div class="sub" id="levelTitle">1 · Primeira pista</div></div><button class="sound" id="soundBtn" aria-label="Ativar ou desativar sons">🔊</button></header>
 <div class="top-progress" id="progress" aria-label="Progresso das cinco fases"></div>
 <div class="choice-head"><span>ESCOLHA SEU CARRINHO 👇</span><span id="currentCar">Foguete</span></div>
 <div class="car-choices" id="carChoices"></div>
 <section class="board-shell" aria-label="Pista de corrida">
  <svg class="stage" id="stage" viewBox="0 0 420 405" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Monte a pista tocando nos espaços pontilhados"></svg>
  <div class="board-note" id="boardNote">🌟 Complete a pista!</div>
  <div id="overlay"></div>
 </section>
 <section class="piece-area"><div class="instruction"><span>🧩 PEÇAS DA PISTA</span><span class="tip">Toque ou arraste 👆</span></div><div class="pieces" id="pieces"></div></section>
 <section class="actions"><button class="btn btn-reset" id="resetBtn" aria-label="Retirar as peças e montar novamente"><span>↻</span><span>Refazer</span></button><button class="btn btn-go" id="goBtn"><span class="btn-icon">▶</span><span id="goText">VAMOS!</span></button></section>
 <div class="assistance"><button id="hintBtn" class="hint-btn" aria-label="Ajudinha para montar a pista">✨ Ajudinha</button><span id="levelCount">FASE 1 DE 5</span></div><div class="toast" id="toast" aria-live="polite">Vamos montar uma superpista!</div>
 <p class="footer">Feito para o Bernardo ♡ · Sem anúncios · Carrinhos originais</p>
</div>
<script>
(()=>{
 'use strict';
 const CARS=[{id:'red',name:'Foguete',color:'#ff5252',roof:'#ffb65b',accent:'#ffe45e',number:'1'},{id:'blue',name:'Tubarão',color:'#38a6f8',roof:'#99e9fa',accent:'#e5f7ff',number:'2'},{id:'yellow',name:'Raio',color:'#ffd53f',roof:'#fff5ad',accent:'#fa7941',number:'3'},{id:'purple',name:'Turbo',color:'#ad7cf1',roof:'#e5caf9',accent:'#fff0fb',number:'4'},{id:'green',name:'Jacaré',color:'#43c9a0',roof:'#c8ffcd',accent:'#ffe26b',number:'5'}];
 const LEVELS=[
  {name:'Primeira pista',intro:'🌟 Vamos unir a pista!',win:'A primeira corrida!',theme:'meadow',slots:[{x:124,w:174,y1:259,y2:259,type:'reta'}],pool:['reta','ponte'],animal:null},
  {name:'O túnel secreto',intro:'🚇 Encontre o túnel!',win:'Uau! Que túnel!',theme:'meadow',slots:[{x:67,w:128,y1:252,y2:252,type:'tunel'},{x:224,w:128,y1:252,y2:252,type:'reta'}],pool:['reta','tunel','ponte'],animal:null},
  {name:'Dino comilão',intro:'🦖 Uma ponte pro Dino!',win:'Você passou pelo Dino!',theme:'jungle',slots:[{x:65,w:128,y1:260,y2:260,type:'ponte'},{x:221,w:130,y1:260,y2:260,type:'reta'}],pool:['reta','ponte','tunel'],animal:'dino',dangerSlot:0},
  {name:'Dragão e foguinho',intro:'🐉 Ponte sobre o foguinho!',win:'Tchau, dragão!',theme:'volcano',slots:[{x:42,w:107,y1:264,y2:264,type:'reta'},{x:157,w:107,y1:264,y2:264,type:'ponte'},{x:272,w:107,y1:264,y2:264,type:'reta'}],pool:['reta','ponte','reta','tunel'],animal:'dragon',dangerSlot:1},
  {name:'A superaventura',intro:'🏁 Descendo até a chegada!',win:'Cinco aventuras completas, Bê!',theme:'festival',slots:[{x:43,w:108,y1:235,y2:288,type:'descida'},{x:157,w:109,y1:288,y2:288,type:'tunel'},{x:272,w:109,y1:288,y2:288,type:'ponte'}],pool:['ponte','tunel','descida','reta'],animal:'duo',dangerSlot:2}
 ];
 const labels={reta:'Reta',ponte:'Ponte',tunel:'Túnel',rampa:'Subida',descida:'Descida'};
 const $=id=>document.getElementById(id); let level=0, carIndex=0, placed=[],selectedSlot=null, running=false, success=false, animId=0, soundOn=true, audioCtx=null, completed=0, lastMessage='';
 try{carIndex=Math.max(0,Math.min(4,Number(localStorage.getItem('pistas-car')||'0')));completed=Math.max(0,Math.min(5,Number(localStorage.getItem('pistas-progress')||'0')))}catch{}
 const current=()=>LEVELS[level];const slotType=id=>current().pool[Number(id.split('-')[1])];
 function safeStore(k,v){try{localStorage.setItem(k,String(v))}catch{}}
 function beep(tone=430,dur=.11,kind='sine',volume=.095){if(!soundOn)return;try{audioCtx ||=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime;o.type=kind;o.frequency.setValueAtTime(tone,now);o.frequency.exponentialRampToValueAtTime(Math.max(100,tone*.75),now+dur);g.gain.setValueAtTime(volume,now);g.gain.exponentialRampToValueAtTime(.001,now+dur);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+dur+.015)}catch{}}
 function melody(win){(win?[523,659,784,1046]:[280,215]).forEach((n,i)=>setTimeout(()=>beep(n,.15,'triangle',.09),i*120))}
 function carArt(c,small=false){return `<g>${!small?'<ellipse cx="0" cy="15" rx="37" ry="5" fill="#234764" opacity=".18"/>':''}<path d="M-32 1 Q-29 -10 -15 -11 L-8 -22 Q0 -29 14 -20 L23 -11 L31 -7 Q37 -6 37 4 L34 8 L-34 8 Q-37 2 -32 1Z" fill="${c.color}" stroke="#173a56" stroke-width="2.8" stroke-linejoin="round"/><path d="M-6 -20 Q0 -25 12 -19 L19 -11 H-10Z" fill="${c.roof}" stroke="#173a56" stroke-width="1.5"/><path d="M-27 -6 H-17" stroke="${c.accent}" stroke-width="3.5" stroke-linecap="round"/><path d="M23 -5 H31" stroke="#fffbe7" stroke-width="5" stroke-linecap="round"/><path d="M-31 5 H33" stroke="#ffffff" stroke-width="2.5" opacity=".35"/><circle cx="-21" cy="8" r="8.1" fill="#193049"/><circle cx="-21" cy="8" r="4.2" fill="#d6edec" class="wheel"/><circle cx="24" cy="8" r="8.1" fill="#193049"/><circle cx="24" cy="8" r="4.2" fill="#d6edec" class="wheel"/><text x="6" y="4" text-anchor="middle" font-size="13" fill="#fff" font-family="system-ui" font-weight="1000">${c.number}</text></g>`}
 function piecePath(s,t){const x=s.x,w=s.w,y=s.y1,y2=s.y2;switch(t){case'ponte':return `M ${x} ${y} C ${x+w*.25} ${y-68} ${x+w*.75} ${y2-68} ${x+w} ${y2}`;case'rampa':return `M${x} ${y} L${x+w} ${y-55}`;case'descida':return `M${x} ${y} L${x+w} ${y2}`;default:return `M${x} ${y} L${x+w} ${y}`}}
 function trackLine(d,ghost=false){return ghost?`<path d="${d}" stroke="#fff" stroke-width="17" stroke-dasharray="12 13" stroke-linecap="round" fill="none" opacity=".88" class="slot-dash"/><path d="${d}" stroke="#fb9a59" stroke-width="3" stroke-dasharray="4 21" stroke-linecap="round" fill="none"/>`:`<path d="${d}" stroke="#973e1e" stroke-width="22" stroke-linecap="round" fill="none"/><path d="${d}" stroke="#ff863c" stroke-width="17" stroke-linecap="round" fill="none"/><path d="${d}" stroke="#ffdb79" stroke-width="2.8" stroke-dasharray="11 11" stroke-linecap="round" fill="none"/>`}
 function tunnelArt(s){const x=s.x+s.w/2,y=(s.y1+s.y2)/2;return `<g pointer-events="none"><path d="M${x-34} ${y+5} V${y-19} Q${x-34} ${y-60} ${x} ${y-64} Q${x+34} ${y-58} ${x+34} ${y-19} V${y+5}" fill="#9581cf" stroke="#503982" stroke-width="6"/><path d="M${x-18} ${y+5} V${y-20} Q${x-18} ${y-45} ${x} ${y-45} Q${x+18} ${y-45} ${x+18} ${y-20} V${y+5}" fill="#45528b"/><path d="M${x-28} ${y-28} H${x-19} M${x+19} ${y-28} H${x+28} M${x} ${y-60} V${y-48}" stroke="#e0c5ef" stroke-width="5"/><circle cx="${x-34}" cy="${y+5}" r="5" fill="#ffcb65"/><circle cx="${x+34}" cy="${y+5}" r="5" fill="#ffcb65"/></g>`}

 function trackGeometry(){const s=current().slots;let d=`M 27 ${s[0].y1} L ${s[0].x} ${s[0].y1}`;s.forEach((z,i)=>{const seg=piecePath(z,z.type).replace(/^M[^CL]*/,'');d+=' '+seg;if(i<s.length-1){const n=s[i+1];d+=` L ${n.x} ${n.y1}`}else d+=` L 397 ${z.y2}`});return d}
 function svgFrame(){const L=current(),zones=L.slots;let s=landscape(L)+themedBackdrop(L)+animalArt(L);
 let priorX=27,priorY=zones[0].y1;s+=`<g id="trackFixed">`;
 zones.forEach((z,i)=>{s+=trackLine(`M${priorX} ${priorY} L${z.x} ${z.y1}`);priorX=z.x+z.w;priorY=z.y2});s+=trackLine(`M ${priorX} ${priorY} L397 ${priorY}`);s+=`</g><g id="stageSlots">`;
 zones.forEach((z,i)=>{let pid=placed[i],type=pid==null?null:slotType(pid);let ghost=type==null;let yy=Math.min(z.y1,z.y2)-80;s+=`<g data-slot-index="${i}" role="button" aria-label="Espaço ${i+1}, ${ghost?'vazio':'ocupado, toque para retirar a peça'}">`;if(selectedSlot===i)s+=`<rect x="${z.x-9}" y="${yy}" width="${z.w+18}" height="130" rx="18" fill="none" stroke="#fff2b4" stroke-width="4" stroke-dasharray="9 12" opacity=".9" class="gap-highlight"/>`;

 if(type==='tunel')s+=tunnelArt(z);

 s+=`<rect x="${z.x-8}" y="${yy}" width="${z.w+16}" height="${Math.max(z.y1,z.y2)-yy+35}" fill="transparent" pointer-events="all" /></g>`});s+='</g>';

 $('stage').innerHTML=s;
 }
 function miniPiece(type){const p=type==='ponte'?'M10 44 C32 5 68 5 90 44':type==='descida'?'M10 14 L90 46':type==='rampa'?'M10 46 L90 14':'M10 39 L90 39';const s=`<path d="${p}" stroke="#973e1e" stroke-width="14" fill="none" stroke-linecap="round"/><path d="${p}" stroke="#ff853f" stroke-width="10" fill="none" stroke-linecap="round"/><path d="${p}" stroke="#ffd37d" stroke-width="2" stroke-dasharray="8 8" fill="none"/>`;return `<svg viewBox="0 0 100 60" aria-hidden="true">${s}${type==='tunel'?'<path d="M32 43 V26 Q50 -2 68 26 V43" fill="none" stroke="#8e78cb" stroke-width="10"/>':''}</svg>`}
 function renderPieces(){const used=new Set(placed.filter(x=>x!=null));const active=current().pool.map((type,i)=>({id:'p-'+i,type})).filter(p=>!used.has(p.id));$('pieces').innerHTML=active.length?active.map(p=>`<button class="piece" data-piece="${p.id}" aria-label="Colocar peça ${labels[p.type]}">${miniPiece(p.type)}<span class="pname">${labels[p.type]}</span></button>`).join(''):'<div class="empty-tray">✨ Todas as peças encaixadas!<br>Agora aperte VAMOS!</div>';for(const b of $('pieces').querySelectorAll('.piece'))setupDrag(b)}
 function renderProgress(){$('progress').innerHTML=LEVELS.map((l,i)=>`<button class="progress-dot ${i===level?'active':i<completed?'done':''} ${i<=completed?'replayable':''}" data-level="${i}" ${i>completed?'disabled':''} aria-label="Fase ${i+1}: ${l.name}" title="${l.name}">${i<completed?"★":i+1}</button>`).join('')}
 function renderCars(){$('carChoices').innerHTML=CARS.map((c,i)=>`<button class="car-choice ${carIndex===i?'selected':''}" data-car="${i}" aria-label="Escolher carrinho ${c.name}" aria-pressed="${carIndex===i}"><svg viewBox="-45 -40 90 70" aria-hidden="true"><g transform="translate(0,-1) scale(.97)">${carArt(c,true)}</g></svg></button>`).join('');$('currentCar').textContent=CARS[carIndex].name}
 function update(msg){if(msg){$('toast').textContent=msg;lastMessage=msg}renderProgress();renderCars();renderPieces();svgFrame();$('levelTitle').textContent=`${level+1} · ${current().name}`;$('levelCount').textContent=`FASE ${level+1} DE ${LEVELS.length}`;if(!success)$('boardNote').textContent=current().intro;$('goText').textContent=running?'VRUUUM!':'VAMOS!';$('goBtn').disabled=running}
 function loadLevel(n){cancelAnimationFrame(animId);document.querySelectorAll('.board-shell .confetti').forEach(el=>el.remove());level=n;placed=Array(current().slots.length).fill(null);selectedSlot=0;running=false;success=false;$('overlay').innerHTML='';update('👇 Toque numa peça para encaixar!')}
 function place(pid,target){if(running||success)return;const z=current().slots;let idx=target;if(idx==null||idx<0||idx>=z.length){idx=selectedSlot!=null?selectedSlot:placed.findIndex(v=>v==null);if(placed[idx]!=null)idx=placed.findIndex(v=>v==null);if(idx<0)idx=z.length-1}
 placed[idx]=pid;selectedSlot=placed.findIndex(v=>v==null);if(selectedSlot<0)selectedSlot=null;beep(480+idx*100,.10,'triangle');update('✨ Boa! Vamos encaixar mais uma?')}
 function setupDrag(el){let start=null,ghost=null,moved=false;el.addEventListener('pointerdown',e=>{if(running)return;start={x:e.clientX,y:e.clientY,id:el.dataset.piece};moved=false;el.setPointerCapture?.(e.pointerId)});el.addEventListener('pointermove',e=>{if(!start)return;if(Math.hypot(e.clientX-start.x,e.clientY-start.y)>11){moved=true;if(!ghost){ghost=document.createElement('div');ghost.className='drag-ghost';ghost.textContent='🛣️';document.body.appendChild(ghost)}ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px'}});el.addEventListener('pointerup',e=>{if(!start)return;const id=start.id;start=null;if(ghost){ghost.remove();ghost=null}let target=null;if(moved){const p=clientToSvg(e.clientX,e.clientY);if(p&&p.x>=18&&p.x<=410&&p.y>100&&p.y<390){let d=Infinity;current().slots.forEach((z,i)=>{const dist=Math.abs(p.x-(z.x+z.w/2));if(dist<d){d=dist;target=i}})}else{return}}place(id,target)});el.addEventListener('pointercancel',()=>{start=null;if(ghost){ghost.remove();ghost=null}})}
 function clientToSvg(x,y){const svg=$('stage');const pt=svg.createSVGPoint();pt.x=x;pt.y=y;const m=svg.getScreenCTM();return m?pt.matrixTransform(m.inverse()):null}
 function getBadSlot(){return current().slots.findIndex((z,i)=>placed[i]==null||slotType(placed[i])!==z.type)}
 function go(){if(running||success)return;running=true;selectedSlot=null;$('overlay').innerHTML='';$('goBtn').disabled=true;$('goText').textContent='VRUUUM!';$('boardNote').textContent='🏎️ Lá vai o carrinho!';beep(235,.25,'sawtooth',.06);$('stage').classList.add('racing');svgFrame();const path=$('racingPath'),length=path.getTotalLength(),bad=getBadSlot();let target=length;if(bad>=0){const xstop=current().slots[bad].x-21;let a=0,b=length;for(let i=0;i<27;i++){const m=(a+b)/2;if(path.getPointAtLength(m).x<xstop)a=m;else b=m}target=a}
 const duration=bad>=0?Math.max(850,900+bad*510):2300+level*260;const start=performance.now();const animate=now=>{const t=Math.min(1,(now-start)/duration),easing=1-Math.pow(1-t,2),at=target*easing,point=path.getPointAtLength(at),prev=path.getPointAtLength(Math.max(0,at-2)),next=path.getPointAtLength(Math.min(length,at+2)),angle=Math.atan2(next.y-prev.y,next.x-prev.x)*180/Math.PI;const g=$('carMoving');if(g){g.setAttribute('transform',`translate(${point.x},${point.y-15}) rotate(${angle}) scale(.65)`);const insideTunnel=current().slots.some((z,i)=>z.type==='tunel'&&slotType(placed[i])==='tunel'&&point.x>(z.x+z.w/2-25)&&point.x<(z.x+z.w/2+25));g.style.opacity=insideTunnel?'.13':'1'}if(t<1)animId=requestAnimationFrame(animate);else{running=false;$('stage').classList.remove('racing');$('goBtn').disabled=false;$('goText').textContent='VAMOS!';if(bad<0)win();else fail(bad)}};animId=requestAnimationFrame(animate)}
 function fail(bad){selectedSlot=bad;const danger=bad===current().dangerSlot;const reactions={dino:'🦖 NHAC! O Dino queria brincar!',dragon:'🐉 Fuuush! O dragão fez foguinho!',croc:'🐊 NHAC! O crocodilo deu risada!',gorilla:'🦍 UHU! O gorila deu um pulão!',shark:'🦈 SPLASH! O tubarão apareceu!',elephant:'🐘 SPLASH! Chuvinha do elefante!',octopus:'🐙 O polvo fez cócegas!',parade:'🦁 Ops! Os bichinhos estão esperando!',duo:'🐉 Ops! O dragão está esperando a ponte!'};const msg=placed[bad]==null?'Opa! Falta um pedacinho! 🧩':danger?(reactions[current().animal]||'Ops! Tente outra peça!'):'Ops! Essa peça não encaixou! 🛠️';$('boardNote').textContent=msg;$('toast').textContent='Tente uma peça diferente! 💛';melody(false);hazardReaction(bad);const badZ=current().slots[bad];const svg=$('stage');let puff=document.createElementNS('http://www.w3.org/2000/svg','g');puff.innerHTML=`<g transform="translate(${badZ.x-8} ${badZ.y1-25})"><circle cx="0" cy="0" r="8" fill="#fff"/><circle cx="15" cy="-7" r="12" fill="#fff"/><circle cx="18" cy="9" r="7" fill="#fff"/><text x="2" y="-21" font-size="27">💨</text></g>`;svg.appendChild(puff);setTimeout(()=>{puff.remove();renderPieces();svgFrame()},bad===current().dangerSlot?900:680)}
 function hazardReaction(bad){const L=current();const hit=bad===L.dangerSlot;if(!hit)return;const svg=$('stage');const z=L.slots[bad],xx=Math.min(350,Math.max(75,z.x+z.w/2)),yy=Math.max(116,z.y1-96);const dino=L.animal==='dino',dragon=L.animal==='dragon'||L.animal==='duo',label=dino?'NHAC!':dragon?'FUUSH!':'OPA!';const bubble=document.createElementNS('http://www.w3.org/2000/svg','g');bubble.setAttribute('pointer-events','none');bubble.innerHTML=`<ellipse cx="${xx}" cy="${yy}" rx="68" ry="24" fill="#fffef8" stroke="#ffba62" stroke-width="4"/><text class="reaction-text" x="${xx}" y="${yy+8}" fill="#eb763d" font-size="23" text-anchor="middle" font-weight="1000">${label}</text>`;svg.appendChild(bubble);svg.classList.add(dino?'dino-chomp':'dragon-flare');const board=document.querySelector('.board-shell');board.classList.add('hazard-bump');const car=$('carMoving');if(car){let x=z.x-21,y=z.y1-15;const parsed=car.getAttribute('transform').match(/translate\(([\d.+-]+),([\d.+-]+)\)/);if(parsed){x=Number(parsed[1]);y=Number(parsed[2])}const tx=dino?202:dragon?Math.min(310,xx+42):xx,ty=dino?316:z.y1-47;const begin=performance.now(),duration=700;const animate=now=>{if(!car.isConnected)return;const t=Math.min(1,(now-begin)/duration),e=t*t*(3-2*t);let xx2=x,yy2=y,rotation=0,scale=.65;if(dino){xx2=x+(tx-x)*e;yy2=y+(ty-y)*e-65*Math.sin(t*Math.PI);rotation=e*390;scale=.65-.47*e;car.style.opacity=String(1-.95*e)}else{xx2=x-17*e;yy2=y-20*Math.sin(t*Math.PI);rotation=-15*Math.sin(t*Math.PI*2);scale=.65-.05*e}car.setAttribute('transform',`translate(${xx2},${yy2}) rotate(${rotation}) scale(${scale})`);if(t<1)requestAnimationFrame(animate)};requestAnimationFrame(animate)}setTimeout(()=>{bubble.remove();svg.classList.remove('dino-chomp','dragon-flare');board.classList.remove('hazard-bump')},890)}
 function confetti(){const shell=document.querySelector('.board-shell');for(let i=0;i<38;i++){const e=document.createElement('div');e.className='confetti';e.style.left=(Math.random()*97)+'%';e.style.background=['#ffad4a','#ff6f8a','#53bfef','#82d7a1','#a185ed'][i%5];e.style.animationDelay=(Math.random()*.65)+'s';e.style.animationDuration=(1.4+Math.random()*1.2)+'s';shell.appendChild(e);setTimeout(()=>e.remove(),3500)}}
 function win(){success=true;completed=Math.max(completed,level+1);safeStore('pistas-progress',completed);melody(true);confetti();$('boardNote').textContent='🎉 CHEGOU! PARABÉNS!';$('toast').textContent='⭐ Você montou uma superpista!';const last=level===LEVELS.length-1;$('overlay').innerHTML=`<div class="big-overlay"><div class="overlay-inner"><div class="overlay-emoji">${last?'🏆':'🌟🏎️'}</div><h2>${last?'SUPER CAMPEÃO!':'Muito bem, Bê!'}</h2><p>${current().win}</p><button id="nextBtn">${last?'🔄 Brincar de novo':'▶ Próxima aventura'}</button><button class="replay" id="againBtn">↻ Correr outra vez</button></div></div>`;$('nextBtn').addEventListener('click',()=>{beep(720);loadLevel(last?0:level+1)});$('againBtn').addEventListener('click',()=>{beep(650);loadLevel(level)})}
 $('progress').addEventListener('click',e=>{const b=e.target.closest?.('[data-level]');if(b&&Number(b.dataset.level)<=completed&&!running)loadLevel(Number(b.dataset.level))});
 $('stage').addEventListener('click',e=>{const slot=e.target.closest?.('[data-slot-index]');if(!slot||running||success)return;const i=Number(slot.dataset.slotIndex);if(placed[i]!=null){placed[i]=null;selectedSlot=i;beep(340,.08);update('Tirou a peça! Escolha outra 🧩')}else{selectedSlot=i;beep(530,.06);update('Escolha uma peça aqui embaixo 👇')}});
 $('carChoices').addEventListener('click',e=>{const b=e.target.closest('[data-car]');if(!b||running)return;carIndex=Number(b.dataset.car);safeStore('pistas-car',carIndex);beep(530+carIndex*60,.09);renderCars();svgFrame()});
 $('soundBtn').addEventListener('click',()=>{soundOn=!soundOn;$('soundBtn').textContent=soundOn?'🔊':'🔇';$('soundBtn').setAttribute('aria-label',soundOn?'Desativar sons':'Ativar sons');if(soundOn)beep(600,.13)});
 $('hintBtn').addEventListener('click',()=>{if(running||success)return;const i=getBadSlot();if(i<0){$('toast').textContent='Tudo pronto! Aperte VAMOS! 🏎️';return}const wanted=current().slots[i].type,used=new Set(placed.filter((v,j)=>j!==i&&v!=null));const candidate=current().pool.findIndex((t,j)=>t===wanted&&!used.has('p-'+j));if(candidate<0)return;placed[i]='p-'+candidate;selectedSlot=placed.findIndex(v=>v==null);if(selectedSlot<0)selectedSlot=null;beep(730,.18,'triangle');update('✨ Uma peça encaixou! Você consegue!')});
 $('resetBtn').addEventListener('click',()=>{beep(320,.10);loadLevel(level)});
 $('goBtn').addEventListener('click',go);
 document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){cancelAnimationFrame(animId);running=false;$('goBtn').disabled=false;$('goText').textContent='VAMOS!';$('stage').classList.remove('racing');svgFrame()}});
 loadLevel(0);
 if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
